<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-container": "#00a7cb", "surface-dim": "#dcd9d9", "inverse-primary": "#ffb59d", "surface": "#ffffff", "surface-container-low": "#f6f3f2", "on-secondary-fixed-variant": "#004d67", "on-background": "#1c1b1b", "secondary-fixed": "#c1e8ff", "primary": "#ab3500", "error": "#ba1a1a", "on-primary-fixed": "#390c00", "on-surface-variant": "#594139", "secondary": "#006687", "primary-fixed-dim": "#ffb59d", "on-primary-fixed-variant": "#832600", "on-tertiary-fixed": "#001f28", "surface-container-lowest": "#ffffff", "primary-fixed": "#ffdbd0", "on-surface": "#1c1b1b", "tertiary-fixed": "#b5ebff", "outline": "#8d7168", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "inverse-surface": "#313030", "surface-container-highest": "#e5e2e1", "surface-variant": "#e5e2e1", "primary-container": "#ff6b35", "inverse-on-surface": "#f3f0ef", "secondary-fixed-dim": "#74d1ff", "outline-variant": "#e1bfb5", "status-developing": "#8a8578", "status-undeveloped": "#2a2a2a", "secondary-container": "#57cafe", "on-tertiary-container": "#003744", "on-error": "#ffffff", "surface-container": "#f0edec", "surface-container-high": "#eae7e7", "tertiary-fixed-dim": "#59d5fb", "on-secondary-fixed": "#001e2b", "on-tertiary-fixed-variant": "#004e60", "text-muted": "#77736d", "on-primary": "#ffffff", "border": "#e8e2d8", "surface-bright": "#fcf9f8", "tertiary": "#00677e", "on-secondary-container": "#00536f", "surface-tint": "#ab3500", "on-secondary": "#ffffff", "on-primary-container": "#5f1900", "background": "#f7f4ee", "on-error-container": "#93000a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "stack-lg": "32px", "stack-sm": "8px", "margin-desktop": "64px", "stack-md": "16px", "gutter": "24px", "margin-mobile": "20px", "unit": "4px" }, "fontFamily": { "caption": ["Inter"], "display-lg-mobile": ["Playfair Display"], "headline-sm": ["Playfair Display"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-md": ["Playfair Display"], "body-lg": ["Inter"], "display-lg": ["Playfair Display"] }, "fontSize": { "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }], "display-lg-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "700" }], "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }], "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }], "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } }</script><style>@layer base { .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-background font-body-md text-on-background"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-4 flex items-center gap-4"><button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface">Add Memory</h1></div></header><main class="relative w-full pt-16 bg-background min-h-screen"><div class="flex flex-col w-full h-full relative bg-background">
<div class="px-4 py-8 flex flex-col gap-12 w-full max-w-md mx-auto h-full">
<div class="flex flex-col gap-2">
<div class="flex items-center gap-2 text-text-muted">
<span class="font-caption text-caption uppercase tracking-wider">Step 3 of 3</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-background">The finer points</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Add context to complete the story of this memory.</p>
</div>
<form class="flex flex-col gap-10 flex-grow" id="memoryDetailsForm">
<div class="flex flex-col gap-8">
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-text-muted uppercase tracking-widest" for="memoryDate">Date</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline">calendar_today</span>
<input class="w-full bg-transparent font-body-lg text-body-lg text-on-background pl-8 py-2 border-b-2 border-border focus:border-tertiary focus:outline-none transition-colors rounded-none placeholder-outline-variant" id="memoryDate" name="memoryDate" placeholder="When did this happen?" type="text" value="Oct 12, 2023"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-muted uppercase tracking-widest" for="memoryTitle">Title</label>
<input class="w-full bg-transparent font-display-lg-mobile text-display-lg-mobile text-on-background py-2 border-b-2 border-border focus:border-tertiary focus:outline-none transition-colors rounded-none placeholder-outline-variant" id="memoryTitle" name="memoryTitle" placeholder="Name this memory" type="text" value="Evening by the Kamo River"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-muted uppercase tracking-widest" for="memoryNote">Note</label>
<textarea class="w-full bg-transparent font-body-md text-body-md text-on-background py-2 border-b-2 border-border focus:border-tertiary focus:outline-none transition-colors rounded-none placeholder-outline-variant resize-none" id="memoryNote" name="memoryNote" placeholder="What made this moment special?" rows="3"></textarea>
</div>
<div class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-text-muted uppercase tracking-widest">Significance</label>
<div class="flex items-center gap-2" id="starRating">
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-primary transition-colors star-btn" data-value="1" type="button">
<span class="material-symbols-outlined text-[32px] star-icon">star</span>
</button>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-primary transition-colors star-btn" data-value="2" type="button">
<span class="material-symbols-outlined text-[32px] star-icon">star</span>
</button>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-primary transition-colors star-btn" data-value="3" type="button">
<span class="material-symbols-outlined text-[32px] star-icon">star</span>
</button>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-primary transition-colors star-btn" data-value="4" type="button">
<span class="material-symbols-outlined text-[32px] star-icon">star</span>
</button>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-primary transition-colors star-btn" data-value="5" type="button">
<span class="material-symbols-outlined text-[32px] star-icon">star</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-muted uppercase tracking-widest" for="memoryTags">Tags</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline">label</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-background pl-8 py-2 border-b-2 border-border focus:border-tertiary focus:outline-none transition-colors rounded-none placeholder-outline-variant" id="memoryTags" name="memoryTags" placeholder="e.g. Kyoto, Autumn, Travel" type="text"/>
</div>
<div class="flex flex-wrap gap-2 mt-2">
<span class="px-3 py-1 bg-surface-container rounded-full font-caption text-caption text-on-surface-variant flex items-center gap-1">Kyoto <button class="material-symbols-outlined text-[14px] hover:text-error" type="button">close</button></span>
<span class="px-3 py-1 bg-surface-container rounded-full font-caption text-caption text-on-surface-variant flex items-center gap-1">Travel <button class="material-symbols-outlined text-[14px] hover:text-error" type="button">close</button></span>
</div>
</div>
</div>
<div class="mt-auto pt-8 pb-4">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-md text-label-md uppercase tracking-wider hover:bg-primary-container hover:text-on-primary-container transition-all shadow-[0_4px_14px_rgba(171,53,0,0.25)] flex items-center justify-center gap-2" type="submit">
<span>Review Memory</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const starBtns = document.querySelectorAll('.star-btn');
    let currentRating = 4; // Pre-filled rating

    function updateStars(rating) {
      starBtns.forEach((btn, index) => {
        const icon = btn.querySelector('.star-icon');
        if (index < rating) {
          btn.classList.add('text-primary');
          btn.classList.remove('text-outline');
          icon.style.fontVariationSettings = "'FILL' 1";
        } else {
          btn.classList.remove('text-primary');
          btn.classList.add('text-outline');
          icon.style.fontVariationSettings = "'FILL' 0";
        }
      });
    }

    // Initialize
    updateStars(currentRating);

    starBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentRating = parseInt(e.currentTarget.dataset.value);
        updateStars(currentRating);
        
        // Add a subtle pop animation to the clicked star
        const icon = btn.querySelector('.star-icon');
        icon.style.transform = 'scale(1.2)';
        setTimeout(() => {
          icon.style.transform = 'scale(1)';
          icon.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
        }, 50);
      });
    });

    const form = document.getElementById('memoryDetailsForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      // Handle form submission
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
        // Proceed to next step logic here
      }, 800);
    });
  });
</script></main></body></html>
