<script>
    document.addEventListener('DOMContentLoaded', () => {
        const detailsCard = document.getElementById('details-card');
        const closeBtn = document.getElementById('close-card-btn');
        const markers = document.querySelectorAll('[id^="marker-"]');

        // Simple interaction to dismiss/show card
        closeBtn.addEventListener('click', () => {
            detailsCard.classList.add('translate-y-[150%]', 'opacity-0');
            // Dim active marker
            document.getElementById('marker-paris').classList.remove('z-20', 'drop-shadow-xl', 'scale-105');
            document.getElementById('marker-paris').classList.add('z-10', 'drop-shadow-md', 'opacity-80');
        });

        // Tapping a marker brings the card back
        markers.forEach(marker => {
            marker.addEventListener('click', (e) => {
                e.stopPropagation();
                // Reset all markers visually
                markers.forEach(m => {
                    m.classList.remove('z-20', 'drop-shadow-xl', 'scale-105', 'opacity-100');
                    m.classList.add('z-10', 'drop-shadow-md', 'opacity-80');
                });
                
                // Highlight clicked marker
                marker.classList.remove('z-10', 'drop-shadow-md', 'opacity-80');
                marker.classList.add('z-20', 'drop-shadow-xl', 'scale-105', 'opacity-100');

                // Show card
                detailsCard.classList.remove('translate-y-[150%]', 'opacity-0');
                
                // Note: In a real app, this would populate the card with data specific to the marker clicked.
            });
        });
    });
