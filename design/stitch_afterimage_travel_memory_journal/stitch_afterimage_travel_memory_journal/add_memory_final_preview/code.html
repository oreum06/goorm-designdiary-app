<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-container": "#00a7cb", "surface-dim": "#dcd9d9", "inverse-primary": "#ffb59d", "surface": "#ffffff", "surface-container-low": "#f6f3f2", "on-secondary-fixed-variant": "#004d67", "on-background": "#1c1b1b", "secondary-fixed": "#c1e8ff", "primary": "#ab3500", "error": "#ba1a1a", "on-primary-fixed": "#390c00", "on-surface-variant": "#594139", "secondary": "#006687", "primary-fixed-dim": "#ffb59d", "on-primary-fixed-variant": "#832600", "on-tertiary-fixed": "#001f28", "surface-container-lowest": "#ffffff", "primary-fixed": "#ffdbd0", "on-surface": "#1c1b1b", "tertiary-fixed": "#b5ebff", "outline": "#8d7168", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "inverse-surface": "#313030", "surface-container-highest": "#e5e2e1", "surface-variant": "#e5e2e1", "primary-container": "#ff6b35", "inverse-on-surface": "#f3f0ef", "secondary-fixed-dim": "#74d1ff", "outline-variant": "#e1bfb5", "status-developing": "#8a8578", "status-undeveloped": "#2a2a2a", "secondary-container": "#57cafe", "on-tertiary-container": "#003744", "on-error": "#ffffff", "surface-container": "#f0edec", "surface-container-high": "#eae7e7", "tertiary-fixed-dim": "#59d5fb", "on-secondary-fixed": "#001e2b", "on-tertiary-fixed-variant": "#004e60", "text-muted": "#77736d", "on-primary": "#ffffff", "border": "#e8e2d8", "surface-bright": "#fcf9f8", "tertiary": "#00677e", "on-secondary-container": "#00536f", "surface-tint": "#ab3500", "on-secondary": "#ffffff", "on-primary-container": "#5f1900", "background": "#f7f4ee", "on-error-container": "#93000a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "stack-lg": "32px", "stack-sm": "8px", "margin-desktop": "64px", "stack-md": "16px", "gutter": "24px", "margin-mobile": "20px", "unit": "4px" }, "fontFamily": { "caption": ["Inter"], "display-lg-mobile": ["Playfair Display"], "headline-sm": ["Playfair Display"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-md": ["Playfair Display"], "body-lg": ["Inter"], "display-lg": ["Playfair Display"] }, "fontSize": { "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }], "display-lg-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "700" }], "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }], "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }], "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } }</script><style>@layer base { .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-background font-body-md text-on-background"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-4 flex items-center gap-4"><button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface">Add Memory</h1></div></header><main class="relative w-full pt-16 bg-background min-h-screen"><div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center px-4 py-8">
<!-- Header Text -->
<div class="text-center mb-8 max-w-sm px-4">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2 tracking-tight">One last look.</h2>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80 leading-relaxed">
                Take a breath. This memory is safe now, waiting to reveal itself.
            </p>
</div>
<!-- The Memory Card -->
<div class="relative w-full max-w-md aspect-[4/5] rounded-[24px] overflow-hidden shadow-[0_12px_30px_rgba(35,28,20,0.10)] bg-surface transform transition-transform duration-500 ease-out scale-95 opacity-0 animate-fade-in-up">
<!-- Photo Area (Blurred & Grayscale) -->
<div class="relative w-full h-full bg-surface-dim">
<img class="absolute inset-0 w-full h-full object-cover grayscale-[100%] blur-md scale-105" data-alt="A serene, wide-angle shot of a bamboo grove in Kyoto, Japan. Sunlight filtering through the tall green stalks. The image is rendered completely in grayscale and is heavily blurred, as if viewed through thick frosted glass or a camera severely out of focus. The overall tone is muted, mysterious, and evocative, matching the 'developing memory' aesthetic. Warm undertones faintly suggest a vintage photograph." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCeDR9eYR5XTJVqp8pPx50havQSm-nBjHBNd1wvwOq7BpiBh86nkXeS9irHJL0nQIKz5GllhEfZkp5o3m9hFLacBEZS7zRhmdzo8mO5gqgLF1ehDn8VkBZEXo9vmoSDmFOoymP0N254T05KWEwcyCHPEswnw6dzPTspLciuG6WNyAuwnl6hy5bOmNjfS5UH2-FJllmUqgyeg6A9AY_jpkv94v4iJdD-q6TnpIpvUuGpfBXrIUbMt2-2LA"/>
<!-- Overlay Gradient for contrast -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-dim/40 to-transparent"></div>
<!-- Washi Tape Accent (Top Right) -->
<div class="absolute top-4 right-4 w-12 h-4 bg-secondary opacity-30 transform rotate-[12deg] rounded-sm shadow-sm"></div>
<div class="absolute top-4 right-4 w-12 h-4 bg-surface opacity-20 transform rotate-[12deg] rounded-sm mix-blend-overlay"></div>
<!-- Development Badge -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center z-10 mix-blend-difference">
<div class="w-16 h-16 rounded-full border-2 border-surface/30 flex items-center justify-center backdrop-blur-sm bg-status-undeveloped/40 text-on-error relative">
<!-- Hairline progress ring (static at 0%) -->
<svg class="absolute inset-0 w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"></circle>
<circle class="text-tertiary-fixed transition-all duration-1000" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="301.59" stroke-dashoffset="301.59" stroke-width="2"></circle>
</svg>
<span class="font-headline-sm text-headline-sm text-on-error">0%</span>
</div>
<span class="font-label-md text-caption text-surface/80 mt-2 uppercase tracking-widest">Undeveloped</span>
</div>
</div>
<!-- Card Meta (Visible below the photo within the card structure if we wanted a bottom bar, but prompt says "Below the card in serif italics". Adjusting to match layout rules and prompt.) -->
</div>
<!-- Meta Info (Below Card) -->
<div class="mt-6 text-center w-full max-w-md px-6 animate-fade-in-up" style="animation-delay: 150ms;">
<h3 class="font-headline-sm text-headline-sm text-on-background italic">Arashiyama Bamboo Grove</h3>
<p class="font-body-md text-caption text-on-surface-variant tracking-wider mt-1">OCTOBER 14, 2023</p>
</div>
<!-- Helper Text -->
<div class="mt-8 px-6 text-center max-w-sm animate-fade-in-up" style="animation-delay: 300ms;">
<p class="font-body-md text-body-md text-text-muted">
                This memory will develop over time. Slow down and watch it come into focus.
            </p>
</div>
</div>
<!-- Fixed Bottom Action -->
<div class="w-full px-4 pb-safe pt-4 bg-gradient-to-t from-background via-background to-transparent sticky bottom-0 z-20">
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-label-md text-body-md flex items-center justify-center gap-2 shadow-[0_8px_16px_rgba(171,53,0,0.2)] transform transition-all active:scale-[0.98] hover:shadow-[0_12px_24px_rgba(171,53,0,0.25)]" id="saveButton">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">book</span>
            Save to Trip Book
        </button>
</div>
</div>
<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const saveBtn = document.getElementById('saveButton');
        
        saveBtn.addEventListener('click', function() {
            // Add a subtle tactile feedback if supported
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
            
            // Visual feedback on the button
            this.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">sync</span> Saving...`;
            this.classList.add('opacity-90');
            
            // Simulate saving delay then redirect/update
            setTimeout(() => {
                this.innerHTML = `<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span> Saved`;
                this.classList.replace('bg-primary', 'bg-tertiary-container');
                this.classList.replace('text-on-primary', 'text-on-tertiary-container');
            }, 1200);
        });
    });
</script></main></body></html>
